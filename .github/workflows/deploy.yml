name: Deploy

on:
  push:
    branches: [main]

jobs:
  terraform:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_webhook_secret: ${{ secrets.WEBHOOK_SECRET }}
      TF_VAR_github_token: ${{ secrets.BOT_GITHUB_TOKEN }}
      TF_VAR_anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
      TF_VAR_anthropic_model: ${{ secrets.ANTHROPIC_MODEL }}
      TF_VAR_openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
      TF_VAR_openrouter_model: ${{ secrets.OPENROUTER_MODEL }}
      # Not secrets, just tuning knobs - repo variables (Settings > Secrets and
      # variables > Actions > Variables), not repo secrets.
      TF_VAR_daily_call_limit: ${{ vars.DAILY_CALL_LIMIT }}
      TF_VAR_per_repo_hourly_limit: ${{ vars.PER_REPO_HOURLY_LIMIT }}
      TF_VAR_debounce_window_seconds: ${{ vars.DEBOUNCE_WINDOW_SECONDS }}
      TF_VAR_contact_email: ${{ vars.CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve
